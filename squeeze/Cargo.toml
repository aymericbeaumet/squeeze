[package]
name = "squeeze-core"
version = "0.3.0"
authors = ["Aymeric Beaumet <hi@aymericbeaumet.com>"]
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Finders for URLs, emails, IPs, hashes, TODOs, and more in free-form text"
repository = "https://github.com/aymericbeaumet/squeeze"
readme = "../readme.md"
keywords = ["extract", "url", "email", "parser", "text"]
categories = ["text-processing", "parsing", "command-line-utilities"]
# The fixtures include live malware URLs; tests and benches run from the repository.
exclude = ["benches/", "tests/"]

[lib]
name = "squeeze"
path = "lib.rs"

[[bench]]
name = "scanner"
path = "benches/scanner.rs"
harness = false

[dependencies]
memchr = "2.8.3"
phf = { version = "0.14.0", features = ["macros"] }

[dev-dependencies]
glob = "0.3.4"
proptest = "1.11.0"
regex = "1.13.1"
regex-syntax = "0.8.11"
