[settings]
lockfile = true

[tools]
rust = { version = "1.99.1", profile = "minimal", components = [
  "clippy",
  "rustfmt",
] }
python = "3.15.0"
actionlint = "1.7.12"

[tasks.build]
description = "Build the workspace"
run = "cargo build --workspace --locked"

[tasks.release]
description = "Build the optimized CLI"
run = "cargo build --release --locked -p squeeze-cli"

[tasks.package]
description = "Package and verify both crates for publication"
run = "cargo package --workspace --locked"

[tasks.test]
description = "Run workspace tests and doctests"
run = [
  "cargo test --workspace --all-targets --locked",
  "cargo test --workspace --doc --locked",
]

[tasks.test-verbose]
run = "cargo test --workspace --locked -- --nocapture"

[tasks.bench]
description = "Benchmark scanner throughput and operation counts (pass options after --)"
run = "cargo bench --locked -p squeeze-lib --bench scanner --"

[tasks.bench-cli]
description = "Benchmark the CLI against ripgrep, grep and ugrep"
tools.hyperfine = "2.0.0"
tools.ripgrep = "15.2.0"
tools.python = "3.15.0"
run = "mise-tasks/bench-cli"

[tasks.lint]
description = "Lint all targets"
run = "cargo clippy --workspace --all-targets --locked -- --deny warnings"

[tasks.fmt]
description = "Format Rust code"
run = "cargo fmt --all"

[tasks.fmt-check]
description = "Check Rust formatting"
run = "cargo fmt --all -- --check"

[tasks.doc]
description = "Build and open documentation"
run = "cargo doc -p squeeze-lib --locked --no-deps --all-features --open"

[tasks.doc-check]
description = "Check documentation without warnings"
env.RUSTDOCFLAGS = "-D warnings"
run = [
  "cargo doc -p squeeze-lib --locked --no-deps --all-features",
  "cargo doc -p squeeze-cli --locked --no-deps --all-features",
]

[tasks.check]
description = "Run formatting, lint, tests, and documentation checks"
run = [
  { task = "fmt-check" },
  { task = "lint" },
  { task = "test" },
  { task = "doc-check" },
]

[tasks.clean]
run = "cargo clean"

[tasks.install]
description = "Install the CLI locally"
run = "cargo install --locked --path ."

[tasks.msrv]
description = "Build and test with the minimum supported Rust version"
tools.rust = "1.95.0"
env.RUSTUP_TOOLCHAIN = "1.95.0"
run = [
  "cargo build --workspace --locked",
  "cargo test --workspace --all-targets --locked",
  "cargo test --workspace --doc --locked",
]

[tasks.release-check]
description = "Validate workflows and release helpers"
run = [
  "actionlint",
  { task = "release-helper-tests" },
]

[tasks.release-helper-tests]
description = "Test the release helper"
run = "python3 -m unittest discover -s .github/scripts -p 'test_*.py'"

[tasks.release-helper]
description = "Run the release helper (pass its command and options after --)"
run = "python3 .github/scripts/release.py"

[tasks.watch]
run = "mise watch test"

[tasks.watch-check]
run = "mise watch check"

[tasks.update]
run = "cargo update"

[tasks.outdated]
tools."github:kbknapp/cargo-outdated" = "0.19.0"
run = "cargo outdated"

[tasks.audit]
tools."aqua:rustsec/rustsec/cargo-audit" = "0.22.2"
run = "cargo audit"

[tasks.demo]
description = "Record the readme demo into docs/demo/demo.gif (Colima on macOS)"
run = [
  "docker run --rm -v \"$PWD:/src\" -v squeeze-demo-cargo:/usr/local/cargo/registry -w /src rust:1.99.1-alpine@sha256:32442d80d49d2b4beffcf91dbe7cedc657cad821e91680a0db3f8e9ee23aad18 cargo build --release --locked -p squeeze-cli --target-dir target/demo",
  "docker run --rm -v \"$PWD:/vhs\" ghcr.io/charmbracelet/vhs:v0.12.1@sha256:ea49a6a1c529be83153e88321892b5585964418f0b9055e8c1e0d732194234a3 docs/demo/demo.tape",
]

[tasks.run]
description = "Run the CLI (pass options after --)"
run = "cargo run --locked -p squeeze-cli --"
