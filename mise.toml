# The mise version CI pins: older ones rewrite mise.lock in an older format.
min_version = "2026.11.14"

[settings]
lockfile = true
lockfile_platforms = ["linux-arm64", "linux-x64", "macos-arm64", "macos-x64", "windows-arm64", "windows-x64"]

[tool_config]
locked = true

[tools]
rust = { version = "1.100.0", profile = "minimal", components = [
  "clippy",
  "rustfmt",
] }
python = "3.15.2"
actionlint = "1.7.12"

[tasks.build]
description = "Build the workspace"
run = "cargo build --workspace --locked"

[tasks.release]
description = "Build the optimized CLI"
run = "cargo build --release --locked -p squeeze-cli"

[tasks.release-musl]
description = "Build the static Linux CLI (pass --target <triple>)"
tools.zig = "0.17.1"
tools."aqua:rust-cross/cargo-zigbuild" = "0.24.1"
run = "cargo zigbuild --release --locked -p squeeze-cli"

[tasks.smoke-musl]
description = "Verify and run the Linux release binary for TARGET in Alpine"
tools.docker-cli = { version = "29.10.0", os = ["linux", "macos"] }
run = [
  '''file "target/$TARGET/release/squeeze" | tee /dev/stderr | grep -Eq "static(ally|-pie) linked"''',
  '''docker run --rm -v "$PWD/target/$TARGET/release:/w:ro" alpine:3@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf sh -c 'echo "see https://example.com." | /w/squeeze --url' | grep -Fx https://example.com''',
]

[tasks.test]
description = "Run workspace tests and doctests"
run = [
  "cargo test --workspace --all-targets --locked",
  "cargo test --workspace --doc --locked",
]

[tasks.test-verbose]
description = "Run workspace tests with their output"
run = "cargo test --workspace --locked -- --nocapture"

[tasks.bench]
description = "Benchmark scanner throughput and operation counts (pass options after --)"
run = "cargo bench --locked -p squeeze-lib --bench scanner --"

[tasks.bench-cli]
description = "Benchmark the CLI against ripgrep, grep and ugrep"
tools.hyperfine = "2.0.0"
tools.ripgrep = "16.0.0"
run = "mise-tasks/bench-cli"

[tasks.lint]
description = "Lint all targets"
run = "cargo clippy --workspace --all-targets --locked -- --deny warnings"

[tasks.fmt]
description = "Format Rust code"
run = "cargo fmt --all"

[tasks.fmt-check]
description = "Check Rust formatting"
run = "cargo fmt --all -- --check"

[tasks.doc]
description = "Build and open documentation"
run = "cargo doc -p squeeze-lib --locked --no-deps --all-features --open"

[tasks.doc-check]
description = "Check documentation without warnings"
env.RUSTDOCFLAGS = "-D warnings"
run = [
  "cargo doc -p squeeze-lib --locked --no-deps --all-features",
  "cargo doc -p squeeze-cli --locked --no-deps --all-features",
]

[tasks.check]
description = "Run formatting, lint, tests, and documentation checks"
run = [
  { task = "fmt-check" },
  { task = "lint" },
  { task = "test" },
  { task = "doc-check" },
]

[tasks.clean]
description = "Remove build outputs"
run = "cargo clean"

[tasks.install]
description = "Install the CLI locally"
run = "cargo install --locked --path ."

[tasks.msrv]
description = "Build and test with the minimum supported Rust version"
tools.rust = { version = "1.95.0", profile = "minimal" }
env.RUSTUP_TOOLCHAIN = "1.95.0"
run = [
  "cargo build --workspace --locked",
  "cargo test --workspace --all-targets --locked",
  "cargo test --workspace --doc --locked",
]

[tasks.release-check]
description = "Validate workflows and release helpers"
tools.shellcheck = "0.11.0"
run = [
  "actionlint",
  { task = "release-helper-tests" },
]

[tasks.release-helper-tests]
description = "Test the release helper"
run = "python3 -m unittest discover -s mise-tasks -p 'test_*.py'"

[tasks.watch]
description = "Rerun the tests on every change"
tools.watchexec = "2.8.0"
run = "mise watch test"

[tasks.watch-check]
description = "Rerun every check on every change"
tools.watchexec = "2.8.0"
run = "mise watch check"

[tasks.update]
description = "Update Cargo.lock within the manifest requirements"
run = "cargo update"

[tasks.outdated]
description = "List outdated crates"
tools."github:kbknapp/cargo-outdated" = "0.20.0"
run = "cargo outdated"

[tasks.audit]
description = "Audit crates for security advisories"
tools."aqua:rustsec/rustsec/cargo-audit" = "0.23.0"
run = "cargo audit"

[tasks.demo]
description = "Record the readme demo into docs/demo/demo.gif (Colima on macOS)"
tools.docker-cli = { version = "29.10.0", os = ["linux", "macos"] }
run = [
  "docker run --rm -v \"$PWD:/src\" -v squeeze-demo-cargo:/usr/local/cargo/registry -w /src rust:1.100.0-alpine@sha256:8d0e82abfdf9a38071e07cabc5afba4ddbe077631a80e4e742a760c38beadc33 cargo build --release --locked -p squeeze-cli --target-dir target/demo",
  "docker run --rm -v \"$PWD:/vhs\" ghcr.io/charmbracelet/vhs:v0.12.1@sha256:ea49a6a1c529be83153e88321892b5585964418f0b9055e8c1e0d732194234a3 docs/demo/demo.tape",
]

[tasks.rust-target]
description = "Install an extra compilation target with the pinned Rust toolchain"
run = "rustup target add"

[tasks.run]
description = "Run the CLI (pass options after --)"
run = "cargo run --locked -p squeeze-cli --"
