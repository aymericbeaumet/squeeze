name: nightly

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  update-homebrew-nightly:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.12
          cache: false
      - name: Update the nightly formula in the tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: mise run release-helper -- nightly --sha "$GITHUB_SHA" --tap aymericbeaumet/homebrew-tap
