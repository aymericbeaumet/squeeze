name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      should_release: ${{ steps.release.outputs.should_release }}
      publish_crates: ${{ steps.release.outputs.publish_crates }}
    steps:
      - uses: actions/checkout@v7
      - name: Test release automation
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Inspect version and existing release
        id: release
        run: python3 .github/scripts/release.py prepare
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_CRATES_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}

  build:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux binaries are built on the glibc host for the static musl target.
          - runner: ubuntu-24.04
            host: x86_64-unknown-linux-gnu
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            host: aarch64-unknown-linux-gnu
            target: aarch64-unknown-linux-musl
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      HOST: ${{ matrix.host || matrix.target }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Select native Rust host
        run: rustup set default-host "$HOST"
      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.15
          cache: false
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Verify native Rust host
        run: |
          rustc -vV | grep -Fx "host: $HOST"
      - name: Add the static musl target
        if: matrix.host
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools
          rustup target add "$TARGET"
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"
      - name: Check formatting and lints
        if: matrix.runner == 'ubuntu-24.04'
        run: mise run check
      - name: Test
        if: matrix.runner != 'ubuntu-24.04'
        run: mise run test
      - name: Build release binary
        run: mise run release -- --target "$TARGET"
      - name: Verify binary version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          "./target/$TARGET/release/squeeze" --version | grep -Fx "squeeze $VERSION"
      - name: Verify the Linux binary is static
        if: matrix.host
        run: |
          file "target/$TARGET/release/squeeze" | tee /dev/stderr | grep -Eq 'static(ally|-pie) linked'
          docker run --rm -v "$PWD/target/$TARGET/release:/w:ro" alpine:3 /w/squeeze --version
      - name: Verify the Windows binary needs no Visual C++ runtime
        if: runner.os == 'Windows'
        run: |
          if grep -qai 'vcruntime140' "target/$TARGET/release/squeeze.exe"; then
            echo "::error::squeeze.exe imports the Visual C++ runtime"
            exit 1
          fi
      - name: Package binary, license, and readme
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: python .github/scripts/release.py package --tag "$TAG" --target "$TARGET"
      - uses: actions/upload-artifact@v7
        with:
          name: squeeze-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          pattern: squeeze-*
          path: dist
          merge-multiple: true
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/squeeze-*
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: python3 .github/scripts/release.py publish --tag "$TAG" --sha "$SHA"

  update-homebrew:
    needs: [prepare, release]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Install the prebuilt binaries from the tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: python3 .github/scripts/release.py homebrew --tag "$TAG" --tap aymericbeaumet/homebrew-tap

  # Runs after the GitHub release exists, so cargo binstall finds the archives,
  # or on its own when the release was published before the token was set.
  publish-crates:
    needs: [prepare, release]
    if: >-
      !cancelled() && needs.prepare.outputs.publish_crates == 'true' &&
      (needs.release.result == 'success' || needs.prepare.outputs.should_release == 'false')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.15
          cache: false
      - uses: Swatinem/rust-cache@v2
      - name: Publish squeeze-lib and squeeze-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: python3 .github/scripts/release.py crates
