name: Bug
description: Crashes, installation problems, or anything else that does not work.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the command, its output, and what you expected.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `squeeze --version`.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: macOS 26 arm64, installed with Homebrew
    validations:
      required: true
