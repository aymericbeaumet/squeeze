[package]
name = "squeeze-cli"
version = "0.3.0"
authors = ["Aymeric Beaumet <hi@aymericbeaumet.com>"]
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Extract URLs, emails, IPs, hashes, TODOs, and more from any text"
repository = "https://github.com/aymericbeaumet/squeeze"
readme = "../readme.md"
keywords = ["extract", "url", "email", "grep", "cli"]
categories = ["command-line-utilities", "text-processing"]

[[bin]]
name = "squeeze"
path = "main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
glob = "0.3"
memchr = "2"
memmap2 = "0.9"
simdutf8 = "0.1"
open = "5"
squeeze = { path = "../squeeze" }
ignore = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# macOS copies with pbcopy: linking AppKit would slow down every start.
[target.'cfg(not(target_os = "macos"))'.dependencies]
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
